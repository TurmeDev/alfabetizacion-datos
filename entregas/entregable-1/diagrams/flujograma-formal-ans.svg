<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 2050" font-family="Arial, sans-serif" font-size="14" fill="#e8e8e8">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8e8e8"/>
    </marker>
  </defs>

  <!-- Dark background -->
  <rect x="0" y="0" width="900" height="2050" fill="#1e1e1e"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">
    Flujograma Formal del Proceso — Estándar ANSI
  </text>
  <text x="450" y="52" text-anchor="middle" font-size="12" font-style="italic" fill="#b0b0b0">
    Servicio: Dos Tonos · Equipo: CriterIA · Módulo 2 — Estación 2
  </text>
  <text x="450" y="72" text-anchor="middle" font-size="11" font-style="italic" fill="#b0b0b0">
    Vista general. El detalle de las actividades marcadas con ↳ está en la sección "Sub-procesos".
  </text>

  <!-- INICIO -->
  <ellipse cx="450" cy="120" rx="120" ry="30" fill="#3a6b41" stroke="#e8e8e8" stroke-width="1.5"/>
  <text x="450" y="116" text-anchor="middle" font-size="12" fill="#ffffff">INICIO</text>
  <text x="450" y="132" text-anchor="middle" font-size="11" fill="#e8e8e8">Brief + mapa visual del proyecto</text>

  <!-- arrow -->
  <line x1="450" y1="150" x2="450" y2="180" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 1. Análisis (simple) -->
  <rect x="250" y="185" width="400" height="60" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="450" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1. Análisis del brief y del contexto del proyecto</text>
  <text x="450" y="228" text-anchor="middle" font-size="11" fill="#e8e8e8">Lectura de guía, mapa, syllabus</text>

  <line x1="450" y1="245" x2="450" y2="275" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Diseño (con sub-proceso) -->
  <rect x="250" y="280" width="400" height="60" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="450" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2. Diseño del servicio y preparación técnica ↳</text>
  <text x="450" y="323" text-anchor="middle" font-size="11" fill="#e8e8e8">Definiciones + configuración</text>

  <line x1="450" y1="340" x2="450" y2="370" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decisión 1 -->
  <polygon points="450,370 580,430 450,490 320,430" fill="#8a6e2a" stroke="#e8e8e8" stroke-width="1.5"/>
  <text x="450" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">¿Decisiones locked-in?</text>
  <text x="450" y="440" text-anchor="middle" font-size="11" fill="#e8e8e8">(diseño experimental, base, contrato)</text>

  <text x="305" y="426" text-anchor="end" font-size="11" font-weight="bold" fill="#ffffff">NO</text>
  <path d="M 320 430 L 230 430 L 230 310 L 248 310" fill="none" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="595" y="426" text-anchor="start" font-size="11" font-weight="bold" fill="#ffffff">SÍ</text>

  <line x1="450" y1="490" x2="450" y2="520" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. Investigación -->
  <rect x="250" y="525" width="400" height="60" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="450" y="550" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3. Investigación de modelos de IA y herramientas</text>
  <text x="450" y="568" text-anchor="middle" font-size="11" fill="#e8e8e8">Listar, evaluar, seleccionar</text>

  <line x1="450" y1="585" x2="450" y2="615" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. Recopilación (con sub-proceso) -->
  <rect x="250" y="620" width="400" height="60" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="450" y="645" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">4. Recopilación de información de candidatos ↳</text>
  <text x="450" y="663" text-anchor="middle" font-size="11" fill="#e8e8e8">3-5 candidatos por área × 3 áreas</text>

  <line x1="450" y1="680" x2="450" y2="710" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5. Desarrollo (con sub-proceso) -->
  <rect x="250" y="715" width="400" height="60" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="450" y="740" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">5. Desarrollo de la aplicación "Dos Tonos" ↳</text>
  <text x="450" y="758" text-anchor="middle" font-size="11" fill="#e8e8e8">Tono A + Tono B + interfaz + captura</text>

  <line x1="450" y1="775" x2="450" y2="805" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decisión 2 -->
  <polygon points="450,805 580,865 450,925 320,865" fill="#8a6e2a" stroke="#e8e8e8" stroke-width="1.5"/>
  <text x="450" y="859" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">¿Pruebas OK?</text>
  <text x="450" y="875" text-anchor="middle" font-size="11" fill="#e8e8e8">(ambos modos leen lo mismo, sesgo solo en Tono A)</text>

  <text x="305" y="861" text-anchor="end" font-size="11" font-weight="bold" fill="#ffffff">NO</text>
  <path d="M 320 865 L 230 865 L 230 745 L 248 745" fill="none" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="595" y="861" text-anchor="start" font-size="11" font-weight="bold" fill="#ffffff">SÍ</text>

  <line x1="450" y1="925" x2="450" y2="955" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6. Pruebas (con sub-proceso) -->
  <rect x="250" y="960" width="400" height="60" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="450" y="985" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">6. Pruebas y validación de la aplicación ↳</text>
  <text x="450" y="1003" text-anchor="middle" font-size="11" fill="#e8e8e8">Preguntas de prueba + verificación</text>

  <line x1="450" y1="1020" x2="450" y2="1050" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 7. Preparación (con sub-proceso) -->
  <rect x="250" y="1055" width="400" height="60" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="450" y="1080" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">7. Preparación de la demostración ↳</text>
  <text x="450" y="1098" text-anchor="middle" font-size="11" fill="#e8e8e8">Inducción + dispositivos + coordinación</text>

  <line x1="450" y1="1115" x2="450" y2="1145" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 8. Demostración (con sub-proceso) -->
  <rect x="250" y="1150" width="400" height="60" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="450" y="1175" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">8. Demostración del proyecto en el colegio ↳</text>
  <text x="450" y="1193" text-anchor="middle" font-size="11" fill="#e8e8e8">Operación con grupos de estudiantes</text>

  <line x1="450" y1="1210" x2="450" y2="1240" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 9. Análisis (con sub-proceso) -->
  <rect x="250" y="1245" width="400" height="60" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="450" y="1270" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">9. Análisis del proceso: tablas ↳</text>
  <text x="450" y="1288" text-anchor="middle" font-size="11" fill="#e8e8e8">Intervinientes + recursos + decisiones</text>

  <line x1="450" y1="1305" x2="450" y2="1335" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 10. Documentación (con sub-proceso) -->
  <rect x="250" y="1340" width="400" height="60" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="450" y="1365" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">10. Diagramas, conclusión y armado del PDF ↳</text>
  <text x="450" y="1383" text-anchor="middle" font-size="11" fill="#e8e8e8">Documentación final del Entregable 1</text>

  <line x1="450" y1="1400" x2="450" y2="1430" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- FIN -->
  <ellipse cx="450" cy="1470" rx="180" ry="35" fill="#3a6b41" stroke="#e8e8e8" stroke-width="1.5"/>
  <text x="450" y="1465" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FIN</text>
  <text x="450" y="1483" text-anchor="middle" font-size="11" fill="#e8e8e8">PDF del Entregable 1 entregado al docente</text>

  <!-- Legend -->
  <rect x="50" y="1545" width="800" height="190" fill="#2a2a2a" stroke="#b0b0b0" stroke-width="1"/>
  <text x="60" y="1570" font-size="13" font-weight="bold" fill="#ffffff">Simbología (ANSI)</text>

  <ellipse cx="120" cy="1605" rx="50" ry="18" fill="#3a6b41" stroke="#e8e8e8" stroke-width="1.5"/>
  <text x="120" y="1610" text-anchor="middle" font-size="10" fill="#ffffff">Inicio / Fin</text>

  <rect x="200" y="1587" width="100" height="36" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="250" y="1610" text-anchor="middle" font-size="10" fill="#ffffff">Actividad</text>

  <rect x="320" y="1587" width="100" height="36" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="320" y="1602" text-anchor="middle" font-size="10" fill="#ffffff">Actividad con</text>
  <text x="320" y="1615" text-anchor="middle" font-size="10" fill="#ffffff">↳ sub-proceso</text>

  <polygon points="460,1605 510,1587 560,1605 510,1623" fill="#8a6e2a" stroke="#e8e8e8" stroke-width="1.5"/>
  <text x="510" y="1610" text-anchor="middle" font-size="10" fill="#ffffff">Decisión</text>

  <line x1="590" y1="1605" x2="650" y2="1605" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="1597" text-anchor="middle" font-size="10" fill="#e8e8e8">Dirección</text>

  <text x="60" y="1660" font-size="11" fill="#b0b0b0">Las actividades marcadas con ↳ tienen un sub-proceso detallado en la sección "Sub-procesos" del documento.</text>
  <text x="60" y="1680" font-size="11" fill="#b0b0b0">Las flechas de retorno (NO en las decisiones) indican que el proceso retrocede a la actividad anterior para corrección, sin avanzar al paso siguiente.</text>
  <text x="60" y="1720" font-size="11" font-style="italic" fill="#b0b0b0">Documento: Entregable 1 — Equipo CriterIA — Servicio: Dos Tonos — Módulo 2 / Estación 2</text>
</svg>
