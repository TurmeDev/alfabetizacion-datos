<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 2400" font-family="Arial, sans-serif" font-size="14" fill="#e8e8e8">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8e8e8"/>
    </marker>
  </defs>

  <!-- Dark background -->
  <rect x="0" y="0" width="900" height="2400" fill="#1e1e1e"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">
    Flujograma Formal del Proceso — Estándar ANSI
  </text>
  <text x="450" y="52" text-anchor="middle" font-size="12" font-style="italic" fill="#b0b0b0">
    Servicio: Dos Tonos · Equipo: CriterIA · Módulo 2 — Estación 2
  </text>

  <!-- INICIO -->
  <ellipse cx="450" cy="110" rx="120" ry="30" fill="#3a6b41" stroke="#e8e8e8" stroke-width="1.5"/>
  <text x="450" y="106" text-anchor="middle" font-size="12" fill="#ffffff">INICIO</text>
  <text x="450" y="122" text-anchor="middle" font-size="11" fill="#e8e8e8">Brief + mapa visual del proyecto</text>

  <!-- arrow -->
  <line x1="450" y1="140" x2="450" y2="170" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 1. Análisis (y=180-280) -->
  <rect x="250" y="180" width="400" height="100" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="450" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1. Análisis del brief y del contexto del proyecto</text>
  <text x="262" y="222" font-size="10" fill="#e8e8e8">• Leer la Guía del Entregable 1</text>
  <text x="262" y="238" font-size="10" fill="#e8e8e8">• Estudiar el mapa visual del proyecto</text>
  <text x="262" y="254" font-size="10" fill="#e8e8e8">• Revisar el syllabus de la asignatura</text>
  <text x="262" y="270" font-size="10" fill="#e8e8e8">• Identificar dudas para el docente</text>

  <line x1="450" y1="280" x2="450" y2="310" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Diseño (y=320-430) -->
  <rect x="250" y="320" width="400" height="110" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="450" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2. Diseño del servicio y preparación técnica</text>
  <text x="262" y="362" font-size="10" fill="#e8e8e8">• Definir el diseño experimental (un modelo, dos modos)</text>
  <text x="262" y="378" font-size="10" fill="#e8e8e8">• Definir las áreas políticas de la base de candidatos</text>
  <text x="262" y="394" font-size="10" fill="#e8e8e8">• Definir el modelo de datos de las respuestas</text>
  <text x="262" y="410" font-size="10" fill="#e8e8e8">• Configurar el espacio de trabajo y herramientas de documentación</text>

  <line x1="450" y1="430" x2="450" y2="460" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decisión 1: ADRs locked-in? (y=470-590) -->
  <polygon points="450,470 580,530 450,590 320,530" fill="#8a6e2a" stroke="#e8e8e8" stroke-width="1.5"/>
  <text x="450" y="524" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">¿Decisiones locked-in?</text>
  <text x="450" y="540" text-anchor="middle" font-size="11" fill="#e8e8e8">(diseño experimental, base, contrato)</text>

  <text x="305" y="526" text-anchor="end" font-size="11" font-weight="bold" fill="#ffffff">NO</text>
  <path d="M 320 530 L 230 530 L 230 350 L 248 350" fill="none" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="595" y="526" text-anchor="start" font-size="11" font-weight="bold" fill="#ffffff">SÍ</text>

  <line x1="450" y1="590" x2="450" y2="620" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. Investigación (y=630-720) -->
  <rect x="250" y="630" width="400" height="90" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="450" y="650" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3. Investigación de modelos de IA y herramientas</text>
  <text x="262" y="672" font-size="10" fill="#e8e8e8">• Listar los modelos de IA disponibles</text>
  <text x="262" y="688" font-size="10" fill="#e8e8e8">• Evaluar restricciones (costo, latencia, idioma)</text>
  <text x="262" y="704" font-size="10" fill="#e8e8e8">• Seleccionar el modelo a usar</text>

  <line x1="450" y1="720" x2="450" y2="750" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. Recopilación (y=760-880) -->
  <rect x="250" y="760" width="400" height="120" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="450" y="780" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">4. Recopilación de información de candidatos</text>
  <text x="262" y="802" font-size="10" fill="#e8e8e8">• Definir las 3 áreas políticas</text>
  <text x="262" y="818" font-size="10" fill="#e8e8e8">• Seleccionar 3-5 candidatos por área</text>
  <text x="262" y="834" font-size="10" fill="#e8e8e8">• Escribir una ficha por candidato</text>
  <text x="262" y="850" font-size="10" fill="#e8e8e8">• Verificar las fuentes</text>
  <text x="262" y="866" font-size="10" fill="#e8e8e8">  (nombre, partido, propuestas, frases, fuente)</text>

  <line x1="450" y1="880" x2="450" y2="910" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5. Desarrollo (y=920-1060) -->
  <rect x="250" y="920" width="400" height="140" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="450" y="940" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">5. Desarrollo de la aplicación "Dos Tonos"</text>
  <text x="262" y="962" font-size="10" fill="#e8e8e8">• Construir el modo Tono A (con sesgo marcado hacia progresiva)</text>
  <text x="262" y="978" font-size="10" fill="#e8e8e8">• Construir el modo Tono B (neutro, balanceado)</text>
  <text x="262" y="994" font-size="10" fill="#e8e8e8">• Construir la interfaz (input del estudiante, 2 respuestas lado a lado)</text>
  <text x="262" y="1010" font-size="10" fill="#e8e8e8">• Implementar la captura de datos para Control de Gestión</text>
  <text x="262" y="1026" font-size="10" fill="#e8e8e8">• Verificar: ambos modos leen lo mismo, sesgo solo en Tono A</text>
  <text x="262" y="1042" font-size="10" fill="#e8e8e8">  (control automático en el sistema)</text>

  <line x1="450" y1="1060" x2="450" y2="1090" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decisión 2: ¿Pruebas OK? (y=1100-1220) -->
  <polygon points="450,1100 580,1160 450,1220 320,1160" fill="#8a6e2a" stroke="#e8e8e8" stroke-width="1.5"/>
  <text x="450" y="1154" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">¿Pruebas OK?</text>
  <text x="450" y="1170" text-anchor="middle" font-size="11" fill="#e8e8e8">(ambos modos leen lo mismo, sesgo solo en Tono A)</text>

  <text x="305" y="1156" text-anchor="end" font-size="11" font-weight="bold" fill="#ffffff">NO</text>
  <path d="M 320 1160 L 230 1160 L 230 950 L 248 950" fill="none" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="595" y="1156" text-anchor="start" font-size="11" font-weight="bold" fill="#ffffff">SÍ</text>

  <line x1="450" y1="1220" x2="450" y2="1250" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6. Pruebas (y=1260-1370) -->
  <rect x="250" y="1260" width="400" height="110" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="450" y="1280" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">6. Pruebas y validación de la aplicación</text>
  <text x="262" y="1302" font-size="10" fill="#e8e8e8">• Probar la aplicación con preguntas de ejemplo</text>
  <text x="262" y="1318" font-size="10" fill="#e8e8e8">• Verificar que Tono A introduce variaciones y Tono B no</text>
  <text x="262" y="1334" font-size="10" fill="#e8e8e8">• Validar que la captura de datos funciona</text>
  <text x="262" y="1350" font-size="10" fill="#e8e8e8">• Documentar bugs y aplicar correcciones</text>

  <line x1="450" y1="1370" x2="450" y2="1400" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 7. Preparación (y=1410-1520) -->
  <rect x="250" y="1410" width="400" height="110" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="450" y="1430" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">7. Preparación de la demostración</text>
  <text x="262" y="1452" font-size="10" fill="#e8e8e8">• Preparar el guion de inducción para el estudiante</text>
  <text x="262" y="1468" font-size="10" fill="#e8e8e8">• Coordinar con el sub-equipo B los roles de operación</text>
  <text x="262" y="1484" font-size="10" fill="#e8e8e8">• Preparar los dispositivos electrónicos para inducción</text>
  <text x="262" y="1500" font-size="10" fill="#e8e8e8">• Preparar el checklist logístico de la Estación 2</text>

  <line x1="450" y1="1520" x2="450" y2="1550" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 8. Demostración (y=1560-1690) -->
  <rect x="250" y="1560" width="400" height="130" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="450" y="1580" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">8. Demostración del proyecto en el colegio</text>
  <text x="262" y="1602" font-size="10" fill="#e8e8e8">• Recibir al grupo de estudiantes en la Estación 2</text>
  <text x="262" y="1618" font-size="10" fill="#e8e8e8">• Hacer la inducción (~2 min): "van a comparar 2 respuestas"</text>
  <text x="262" y="1634" font-size="10" fill="#e8e8e8">• El estudiante tipea su pregunta sobre un candidato</text>
  <text x="262" y="1650" font-size="10" fill="#e8e8e8">• Recibir las 2 respuestas (Tono A y Tono B) lado a lado</text>
  <text x="262" y="1666" font-size="10" fill="#e8e8e8">• Facilitar la comparación: "¿ven alguna diferencia?"</text>
  <text x="262" y="1682" font-size="10" fill="#e8e8e8">• Capturar los datos para Control de Gestión</text>

  <line x1="450" y1="1690" x2="450" y2="1720" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 9. Análisis del proceso (y=1730-1850) -->
  <rect x="250" y="1730" width="400" height="120" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="450" y="1750" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">9. Análisis del proceso: tablas</text>
  <text x="450" y="1766" text-anchor="middle" font-size="11" font-style="italic" fill="#b0b0b0">intervinientes, recursos y decisiones</text>
  <text x="262" y="1788" font-size="10" fill="#e8e8e8">• Llenar la tabla de intervinientes y funciones</text>
  <text x="262" y="1804" font-size="10" fill="#e8e8e8">• Llenar la tabla de recursos y documentos</text>
  <text x="262" y="1820" font-size="10" fill="#e8e8e8">• Llenar la tabla de decisiones y controles</text>
  <text x="262" y="1836" font-size="10" fill="#e8e8e8">• Revisar la coherencia entre las 3 tablas</text>

  <line x1="450" y1="1850" x2="450" y2="1880" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 10. Documentación final (y=1890-2020) -->
  <rect x="250" y="1890" width="400" height="130" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="450" y="1910" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">10. Diagramas, conclusión y armado del documento final</text>
  <text x="262" y="1932" font-size="10" fill="#e8e8e8">• Construir el flujograma formal (este diagrama)</text>
  <text x="262" y="1948" font-size="10" fill="#e8e8e8">• Redactar la conclusión del equipo (300 palabras)</text>
  <text x="262" y="1964" font-size="10" fill="#e8e8e8">• Armar el PDF único con las 6 partes de la Guía</text>
  <text x="262" y="1980" font-size="10" fill="#e8e8e8">• Verificar el formato del nombre del archivo PDF</text>
  <text x="262" y="1996" font-size="10" fill="#e8e8e8">• Subir a la plataforma del docente</text>
  <text x="262" y="2012" font-size="10" fill="#e8e8e8">  (formato: CriterIA_Entregable_1_StartupEducativa.pdf)</text>

  <line x1="450" y1="2020" x2="450" y2="2050" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- FIN -->
  <ellipse cx="450" cy="2090" rx="180" ry="35" fill="#3a6b41" stroke="#e8e8e8" stroke-width="1.5"/>
  <text x="450" y="2085" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FIN</text>
  <text x="450" y="2103" text-anchor="middle" font-size="11" fill="#e8e8e8">PDF del Entregable 1 entregado al docente</text>

  <!-- Legend (simbología ANSI) -->
  <rect x="50" y="2180" width="800" height="200" fill="#2a2a2a" stroke="#b0b0b0" stroke-width="1"/>
  <text x="60" y="2205" font-size="13" font-weight="bold" fill="#ffffff">Simbología (ANSI)</text>

  <ellipse cx="120" cy="2240" rx="50" ry="18" fill="#3a6b41" stroke="#e8e8e8" stroke-width="1.5"/>
  <text x="120" y="2245" text-anchor="middle" font-size="10" fill="#ffffff">Inicio / Fin</text>

  <rect x="200" y="2222" width="100" height="36" fill="#2a4a6b" stroke="#e8e8e8" stroke-width="1.5" rx="4"/>
  <text x="250" y="2245" text-anchor="middle" font-size="10" fill="#ffffff">Actividad (con sub-pasos)</text>

  <polygon points="380,2240 430,2222 480,2240 430,2258" fill="#8a6e2a" stroke="#e8e8e8" stroke-width="1.5"/>
  <text x="430" y="2245" text-anchor="middle" font-size="10" fill="#ffffff">Decisión</text>

  <line x1="510" y1="2240" x2="570" y2="2240" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="2232" text-anchor="middle" font-size="10" fill="#e8e8e8">Dirección del flujo</text>

  <text x="60" y="2300" font-size="11" fill="#b0b0b0">Las flechas de retorno (NO en las decisiones) indican que el proceso retrocede a la actividad anterior para corrección, sin avanzar al paso siguiente.</text>
  <text x="60" y="2320" font-size="11" fill="#b0b0b0">El retorno solo se da cuando la condición de la decisión no se cumple; cuando se cumple (SÍ), el flujo continúa hacia abajo.</text>
  <text x="60" y="2350" font-size="11" font-style="italic" fill="#b0b0b0">Documento: Entregable 1 — Equipo CriterIA — Servicio: Dos Tonos — Módulo 2 / Estación 2</text>
  <text x="60" y="2370" font-size="11" fill="#b0b0b0">Versión detallada: cada actividad lista los sub-pasos que se ejecutan dentro del rectángulo.</text>
</svg>
